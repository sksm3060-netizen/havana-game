<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הבנה היא שריר - המשחק</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@500;700;800&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{--brown:#744732;--text:#3E2C24;--cream:#FBF7F0;--pink:#F6A7C0;--pinkl:#FCE6EE;--mint:#B3D8C2;--mintl:#E6F3EB;--butter:#F1DFA3;--butterl:#FBF4DC;--lilac:#C7C0D6;--lilacl:#EEEBF4;--peach:#EEBF9D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--cream);color:var(--text);font-family:'Noto Sans Hebrew',Arial,sans-serif;min-height:100vh}
.top{height:8px;background:linear-gradient(90deg,var(--pink),var(--lilac),var(--mint),var(--butter),var(--peach))}
.wrap{max-width:620px;margin:0 auto;padding:14px 16px 30px;display:flex;flex-direction:column;gap:14px}
.screen{display:none}.screen.on{display:flex}
h1{font-family:'Secular One',sans-serif;color:var(--brown);margin:0;font-size:30px;line-height:1.2}
h2{font-family:'Secular One',sans-serif;color:var(--brown);margin:0;font-size:24px}
.btn{font-family:'Secular One',sans-serif;font-size:22px;border:none;border-radius:99px;padding:10px 26px;cursor:pointer;background:var(--brown);color:#fff;box-shadow:0 3px 0 #4d2e20}
.btn.light{background:#fff;color:var(--brown);box-shadow:0 3px 0 #d9c6b6;font-size:17px}
.btn:active{transform:translateY(3px);box-shadow:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
/* home */
.hero-title{text-align:center;padding:18px 0 4px}
.hero-title h1{font-size:40px}
.hero-title p{margin:4px 0 0;font-size:18px;font-weight:700;color:#8a5a44}
.doors{display:flex;flex-direction:column;gap:14px}
.door{display:flex;align-items:center;gap:16px;background:#fff;border-radius:22px;padding:14px 18px;border:3px solid var(--mint);cursor:pointer;text-align:right;font:inherit;color:inherit;box-shadow:0 4px 0 #e6d8cb}
.door:nth-child(2){border-color:var(--pink)}.door:nth-child(3){border-color:var(--butter)}
.door img{width:74px;height:74px;object-fit:contain;flex:none}
.door b{display:block;font-family:'Secular One',sans-serif;font-size:24px;color:var(--brown)}
.door span{font-size:16px;font-weight:600}
.door b span{font-size:inherit;font-weight:inherit}
.door.soon{opacity:.55;cursor:default}
.door em{font-style:normal;background:var(--butter);border-radius:99px;padding:1px 10px;font-size:13px;font-weight:800;color:var(--brown);margin-inline-start:6px}
/* levels */
.lvls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lv{background:#fff;border:3px solid var(--mint);border-radius:20px;padding:14px;cursor:pointer;font:inherit;color:inherit;text-align:center;box-shadow:0 4px 0 #e6d8cb}
.lv b{display:block;font-family:'Secular One',sans-serif;font-size:24px;color:var(--brown)}
.lv span{font-size:15px;font-weight:700}
.lv .st{display:block;font-size:20px;letter-spacing:2px;margin-top:4px;min-height:28px;color:#e2b93b}
.lv.lock{opacity:.45;cursor:default;border-color:#e6d8cb}
.lv:last-child{grid-column:1/-1}
/* play */
.lvl{background:var(--butter);color:var(--brown);font-weight:800;border-radius:99px;padding:3px 14px;font-size:15px}
.dots{display:flex;gap:6px}
.dots i{width:15px;height:15px;border-radius:50%;background:#e6d8cb}
.dots i.on{background:var(--mint);box-shadow:0 0 0 2px var(--brown) inset}
.card{background:#fff;border-radius:20px;padding:14px 18px;border:2px solid var(--mint)}
.card small{display:block;color:#8a5a44;font-weight:700;font-size:15px;margin-bottom:4px;line-height:1.6}
.instr{font-size:25px;font-weight:800;line-height:1.65;margin:0}
.card.pulse{animation:pulse .9s ease 2}
@keyframes pulse{50%{background:var(--butterl);border-color:var(--butter);transform:scale(1.02)}}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.opt{font:inherit;font-size:21px;font-weight:800;line-height:1.6;text-align:right;background:var(--lilacl);border:2px solid var(--lilac);border-radius:16px;padding:10px 14px;cursor:pointer;color:var(--text)}
.opt.no{opacity:.4;text-decoration:line-through;cursor:default}
.opt.yes{background:var(--mintl);border-color:var(--mint)}
.board{direction:ltr;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));aspect-ratio:6/5;width:100%;border:3px solid var(--brown);border-radius:16px;overflow:hidden;background:#fff;position:relative}
.cell{min-width:0;min-height:0;overflow:hidden;border:1px solid #eadbcd;display:flex;align-items:center;justify-content:center;position:relative}
.cell img{width:72%;height:72%;object-fit:contain;transition:transform .4s,opacity .4s}
.cell.start{background:var(--mintl)}
.cell.trail::after{content:"";position:absolute;width:12%;aspect-ratio:1;border-radius:50%;background:var(--pink);opacity:.8}
.cell.target{background:var(--butterl);box-shadow:0 0 0 4px var(--butter) inset;animation:glow 1.2s infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 7px var(--butter) inset}}
.cell img.taken{transform:scale(1.6);opacity:0}
.hero{position:absolute;width:16.666%;height:20%;display:flex;align-items:center;justify-content:center;transition:left .22s ease,top .22s ease;pointer-events:none;z-index:2}
.hero img{width:80%;height:80%;object-fit:contain;border-radius:50%;background:#fff;border:3px solid var(--pink);box-shadow:0 3px 8px #0002}
.hero.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);grid-template-rows:repeat(2,64px);gap:8px;justify-content:center;direction:ltr}
.pad button{font-size:34px;border:none;border-radius:16px;background:#fff;color:var(--brown);box-shadow:0 3px 0 #d9c6b6;cursor:pointer;font-weight:800;font-family:inherit}
.pad button:active{transform:translateY(3px);box-shadow:none}
.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.pad span{display:block;font-size:13px;font-weight:700;margin-top:-6px}
.acts{display:flex;gap:10px;justify-content:center}
.bag{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:54px;background:var(--butterl);border-radius:16px;padding:6px}
.bag img{width:44px;height:44px;object-fit:contain;animation:pop .5s}
.bag b{color:#8a5a44;font-size:14px}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}}
.msg{position:fixed;inset:0;background:#3e2c2455;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.msg.show{display:flex}
.msg .box{background:#fff;border-radius:24px;padding:22px 24px;text-align:center;max-width:420px;width:100%;border:3px solid var(--mint);animation:pop .4s}
.msg .box img{width:110px;height:110px;object-fit:contain}
.msg p{font-size:23px;font-weight:800;margin:8px 0 16px;line-height:1.55}
.msg.bad .box{border-color:var(--butter)}
.msg .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.stars{font-size:30px;letter-spacing:4px;color:#e2b93b}
/* detective */
.case{display:flex;gap:12px;align-items:center}
.case .ob{width:70px;height:70px;flex:none;display:flex;align-items:center;justify-content:center;font-size:48px}
.case .ob img{width:100%;height:100%;object-fit:contain}
.rep{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sent{font:inherit;font-size:22px;font-weight:800;line-height:1.6;text-align:right;background:none;border:2px solid transparent;border-radius:12px;padding:2px 8px;color:var(--text);cursor:default}
.rep.pick .sent{cursor:pointer;background:var(--butterl);border-color:var(--butter)}
.sent.no{opacity:.45;text-decoration:line-through}
.sent.yes{background:var(--mintl)!important;border-color:var(--mint)!important}
.ask{font-size:19px;font-weight:800;color:var(--brown);text-align:center;margin:0}
.sus{display:flex;flex-direction:column;gap:10px}
.su{display:flex;align-items:center;gap:12px;font:inherit;text-align:right;background:#fff;border:3px solid var(--lilac);border-radius:18px;padding:8px 12px;cursor:pointer;color:var(--text);box-shadow:0 3px 0 #e6d8cb}
.su .pic{width:64px;height:64px;flex:none;display:flex;align-items:center;justify-content:center;font-size:44px}
.su .pic img{width:100%;height:100%;object-fit:contain}
.su b{display:block;font-family:'Secular One',sans-serif;font-size:21px;color:var(--brown)}
.su span{font-size:19px;font-weight:700;line-height:1.5}
.su.no{opacity:.4;cursor:default}
.su.yes{border-color:var(--mint);background:var(--mintl)}
.emo{font-size:80px;line-height:1.2}
.emo img{width:110px;height:110px;object-fit:contain}
.bag .e{font-size:34px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="top"></div>
<div class="wrap">

<section class="screen on" id="sHome" style="flex-direction:column;gap:16px">
  <div class="hero-title"><h1 id="tTitle"></h1><p id="tSub"></p></div>
  <h2 id="tPick" style="text-align:center"></h2>
  <div class="doors">
    <button class="door" id="dMaze"><img id="iMaze" alt=""><div><b id="tMaze"></b><span id="tMazeSub"></span></div></button>
    <button class="door" id="dDet"><img id="iDet" alt=""><div><b><span id="tDet"></span></b><span id="tDetSub"></span></div></button>
    <button class="door soon" id="dTrip"><img id="iTrip" alt=""><div><b><span id="tTrip"></span><em id="tSoon2"></em></b><span id="tTripSub"></span></div></button>
  </div>
</section>

<section class="screen" id="sLevels" style="flex-direction:column;gap:14px">
  <div class="bar"><h1 id="tMaze2"></h1><button class="btn light" id="bHome1"></button></div>
  <h2 id="tLevels"></h2>
  <div class="lvls" id="lvls"></div>
</section>

<section class="screen" id="sPlay" style="flex-direction:column;gap:14px">

  <div class="acts" id="acts"><button class="btn" id="bCheck"></button><button class="btn light" id="bAgain"></button></div>
  <div class="bag" id="bag"></div>
</section>
<section class="screen" id="sDL" style="flex-direction:column;gap:14px">
  <div class="bar"><h1 id="tDet2"></h1><button class="btn light" id="bHome2"></button></div>
  <h2 id="tDL"></h2>
  <div class="lvls" id="dlvls"></div>
</section>

<section class="screen" id="sDet" style="flex-direction:column;gap:12px">
  <div class="bar"><div style="display:flex;gap:10px;align-items:center"><span class="lvl" id="dLvl"></span><div class="dots" id="ddots"></div></div><button class="btn light" id="bBack2"></button></div>
  <div class="card"><small id="dIntro"></small>
    <div class="case"><div class="ob" id="dOb"></div><h2 id="dCase"></h2></div>
    <div class="rep" id="dRep"></div></div>
  <p class="ask" id="dAsk"></p>
  <div class="sus" id="dSus"></div>
  <div class="bag" id="dBag"></div>
</section>
</div>
<div class="msg" id="msg"><div class="box"><div id="mImg"></div><p id="mTxt"></p><div class="row" id="mBtns"></div></div></div>

function cheer(){tone(660,0,.15);tone(880,.12,.15);tone(1100,.24,.3)}
// ---------- screens ----------
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}
$('tTitle').innerHTML=U.title;$('tSub').innerHTML=U.subtitle;$('tPick').innerHTML=U.pick;
$('tMaze').innerHTML=U.maze;$('tMaze2').innerHTML=U.maze;$('tMazeSub').innerHTML=U.maze_sub;$('tDet').innerHTML=U.det;$('tDetSub').innerHTML=U.det_sub;
$('tTrip').innerHTML=U.trip;$('tTripSub').innerHTML=U.trip_sub;$('tSoon2').innerHTML=U.soon;
$('iMaze').src=D.doors.maze;$('iDet').src=D.doors.det;$('iTrip').src=D.doors.trip;
$('tLevels').innerHTML=U.levels;$('bHome1').innerHTML=U.home;$('bBack').innerHTML=U.back;$('bCheck').innerHTML=U.check;$('bAgain').innerHTML=U.again;
$('dMaze').onclick=()=>{drawLevels();show('sLevels')};
$('bHome1').onclick=()=>show('sHome');
$('bBack').onclick=()=>{drawLevels();show('sLevels')};
function starStr(n){return n?'★'.repeat(n):''}
function drawLevels(){const box=$('lvls');box.innerHTML='';
  D.levels.forEach((L,i)=>{const b=document.createElement('button');const lock=false; /* Karni: all levels open, any order */b.className='lv'+(lock?' lock':'');
    const st=prog.stars[i];b.innerHTML='<b>'+L.name+'</b><span>'+L.sub+'</span><span class="st">'+(st?starStr(Math.round(st)):'')+'</span>';
    b.onclick=()=>{if(lock){popup(false,null,U.locked,[[U.back,()=>{}]]);return}start(i)};box.appendChild(b)})}
// ---------- play ----------
let li=0,ti=0,pos,cells={},tries=0,earned=[],busy=false;
const board=$('board');
function popup(ok,img,txt,btns){const m=$('msg');m.classList.toggle('bad',!ok);$('mImg').innerHTML=img?'<img src="'+img+'" alt="">':'';$('mTxt').innerHTML=txt;
  const r=$('mBtns');r.innerHTML='';btns.forEach(([t,fn],k)=>{const b=document.createElement('button');b.className='btn'+(k?' light':'');b.innerHTML=t;b.onclick=()=>{m.classList.remove('show');fn()};r.appendChild(b)});m.classList.add('show')}
function buildBoard(L){board.innerHTML='';cells={};
  for(let r=0;r<D.H;r++)for(let c=0;c<D.W;c++){const el=document.createElement('div');el.className='cell'+(c===D.start[0]&&r===D.start[1]?' start':'');cells[c+','+r]=el;board.appendChild(el)}
  cells[D.start.join(',')].innerHTML='<img src="'+D.flag+'" alt="">';
  for(const k in L.board){const [c,r]=L.board[k];cells[c+','+r].innerHTML='<img data-k="'+k+'" src="'+D.art[k].img+'" alt="">'}
  const h=document.createElement('div');h.className='hero';h.id='hero';h.innerHTML='<img src="'+D.hero+'" alt="">';board.appendChild(h)}
function place(){const h=$('hero');h.style.left=(pos[0]*100/D.W)+'%';h.style.top=(pos[1]*100/D.H)+'%'}
function clearTrail(){Object.values(cells).forEach(c=>c.classList.remove('trail'))}
function reset(){pos=[...D.start];clearTrail();place()}
function shake(){const h=$('hero');h.classList.remove('shake');void h.offsetWidth;h.classList.add('shake');tone(180,0,.15)}
function step(d){const n=[pos[0]+DIR[d][0],pos[1]+DIR[d][1]];
  if(n[0]<0||n[0]>=D.W||n[1]<0||n[1]>=D.H){shake();return}
  if(!(pos[0]===D.start[0]&&pos[1]===D.start[1]))cells[pos.join(',')].classList.add('trail');
  pos=n;place();tone(520,0,.08)}
document.querySelectorAll('#pad button').forEach(b=>b.onclick=()=>{if(!busy)step(b.dataset.d)});
document.addEventListener('keydown',e=>{const m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R'}[e.key];
  if(m&&$('sPlay').classList.contains('on')&&!$('msg').classList.contains('show')&&D.levels[li].kind==='move'&&!busy){e.preventDefault();step(m)}});
$('bAgain').onclick=()=>{if(!busy)reset()};
function start(i){li=i;ti=0;earned=[];const L=D.levels[i];buildBoard(L);
  $('pLvl').innerHTML=L.name;$('pIntro').innerHTML=L.intro;$('dots').innerHTML=L.tasks.map(()=>'<i></i>').join('');
  $('bag').innerHTML='<b>'+U.bag+'</b>';const mv=L.kind==='move';
  $('pad').classList.toggle('hide',!mv);$('acts').classList.toggle('hide',!mv);show('sPlay');reset();task()}
function task(){const L=D.levels[li],T=L.tasks[ti];tries=0;Object.values(cells).forEach(c=>c.classList.remove('target'));
  [...$('dots').children].forEach((d,k)=>d.classList.toggle('on',k<ti));
  if(L.kind==='move'){$('pInstr').innerHTML=T.t;$('pOpts').innerHTML=''}
  else{$('pInstr').innerHTML=U.mark;cells[T.goal.join(',')].classList.add('target');
    $('pOpts').innerHTML='';T.opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.innerHTML=o.t;b.onclick=()=>choose(o,b);$('pOpts').appendChild(b)})}}
function collect(T){const im=T.item&&cells[T.goal.join(',')].querySelector('img');if(im)im.classList.add('taken');
  const b=document.createElement('img');b.src=T.item?D.art[T.item].img:D.hero;$('bag').appendChild(b)}
function success(){const L=D.levels[li],T=L.tasks[ti];const s=tries===0?3:2;earned.push(s);cheer();
  const txt=(L.kind==='choose'?U.choose_ok:(T.item?U.got+' '+D.art[T.item].name+'!':U.spot))+'<div class="stars">'+starStr(s)+'</div>';
  popup(true,T.item?D.art[T.item].img:null,txt,[[ti<L.tasks.length-1?U.next:U.finish,()=>{collect(T);ti++;reset();if(ti<L.tasks.length)task();else levelDone()}]])}
function levelDone(){const L=D.levels[li];[...$('dots').children].forEach(d=>d.classList.add('on'));
  const avg=earned.reduce((a,b)=>a+b,0)/earned.length;prog.stars[li]=Math.max(prog.stars[li]||0,avg);prog.open=Math.max(prog.open,Math.min(li+1,D.levels.length-1));
  if(li===D.levels.length-1)prog.done=true;save();cheer();
  const last=li===D.levels.length-1;
  popup(true,D.hero,(last?U.all_done:U.lvl_done+' '+L.name+'!')+'<div class="stars">'+starStr(Math.round(avg))+'</div>',
    last?[[U.to_levels,()=>{drawLevels();show('sLevels')}]]:[[U.next_lvl,()=>start(li+1)],[U.to_levels,()=>{drawLevels();show('sLevels')}]])}
$('bCheck').onclick=()=>{if(busy)return;const T=D.levels[li].tasks[ti];
  if(pos[0]===T.goal[0]&&pos[1]===T.goal[1])success();
  else{tries++;tone(300,0,.2);popup(false,null,U.wrong,[[U.retry,()=>{reset();const c=$('card');c.classList.remove('pulse');void c.offsetWidth;c.classList.add('pulse')}]])}};
function choose(o,btn){if(busy||btn.classList.contains('no'))return;busy=true;reset();let k=0;
  const iv=setInterval(()=>{if(k>=o.steps.length){clearInterval(iv);busy=false;
      if(o.ok){btn.classList.add('yes');success()}else{tries++;btn.classList.add('no');tone(300,0,.2);popup(false,null,U.choose_wrong,[[U.retry,()=>reset()]])}return}
    const d=o.steps[k++];if(d==='X')shake();else step(d)},380)}
// ================= DETECTIVE =================
const DD=D.det,DU=DD.ui;
let dprog={stars:{}};
try{const s=JSON.parse(localStorage.getItem('hm_det')||'null');if(s)dprog=s}catch(e){}
function dsave(){try{localStorage.setItem('hm_det',JSON.stringify(dprog))}catch(e){}}
function isImg(a){return a.indexOf('data:')===0}
function art(k){const a=DD.art[k];return isImg(a)?'<img src="'+a+'" alt="">':a}
$('tDet2').innerHTML=U.det;$('tDL').innerHTML=DU.det_levels;$('bHome2').innerHTML=U.home;$('bBack2').innerHTML=U.back;
if(!isImg(D.doors.det)){}
$('dDet').onclick=()=>{drawDL();show('sDL')};
$('bHome2').onclick=()=>show('sHome');
$('bBack2').onclick=()=>{drawDL();show('sDL')};
function drawDL(){const box=$('dlvls');box.innerHTML='';
  DD.levels.forEach((L,i)=>{const b=document.createElement('button');b.className='lv';const st=dprog.stars[i];
    b.innerHTML='<b>'+L.name+'</b><span>'+L.sub+'</span><span class="st">'+(st?starStr(Math.round(st)):'')+'</span>';
    b.onclick=()=>dstart(i);box.appendChild(b)})}
let dl=0,dc=0,dtries=0,dearn=[],phase='who';
function dstart(i){dl=i;dc=0;dearn=[];const L=DD.levels[i];
  $('dLvl').innerHTML=L.name;$('dIntro').innerHTML=L.intro;$('ddots').innerHTML=L.cases.map(()=>'<i></i>').join('');
  $('dBag').innerHTML='<b>'+DU.solved_bag+'</b>';show('sDet');dcase()}
function dcase(){const L=DD.levels[dl],C=L.cases[dc];dtries=0;phase='who';
  [...$('ddots').children].forEach((d,k)=>d.classList.toggle('on',k<dc));
  $('dOb').innerHTML=art(C.obj);$('dCase').innerHTML=DU.report+' · '+DU.case+' '+(dc+1);
  const R=$('dRep');R.className='rep';R.innerHTML='';
  C.report.forEach((t,k)=>{const b=document.createElement('button');b.className='sent';b.innerHTML=t;b.onclick=()=>dproof(k,b);R.appendChild(b)});
  $('dAsk').innerHTML=DU.who;const S=$('dSus');S.innerHTML='';
  C.sus.forEach(([k,desc],j)=>{const b=document.createElement('button');b.className='su';
    b.innerHTML='<div class="pic">'+art(k)+'</div><div><b>'+DD.names[k]+'</b><span>'+desc+'</span></div>';
    b.onclick=()=>dwho(j,b);S.appendChild(b)});window.scrollTo(0,0)}
function pulseCard(){const c=document.querySelector('#sDet .card');c.classList.remove('pulse');void c.offsetWidth;c.classList.add('pulse')}
function dwho(j,b){if(phase!=='who'||b.classList.contains('no'))return;const L=DD.levels[dl],C=L.cases[dc];
  if(j===C.ans){b.classList.add('yes');tone(660,0,.12);tone(880,.1,.15);phase='proof';
    [...$('dSus').children].forEach((x,k)=>{if(k!==j)x.classList.add('hide')});
    $('dRep').classList.add('pick');$('dAsk').innerHTML='🔍 '+(L.lie?DU.proof_lie:DU.proof);pulseCard();
    window.scrollTo({top:0,behavior:'smooth'})}
  else{dtries++;b.classList.add('no');tone(300,0,.2);popup(false,null,DU.det_wrong,[[U.retry,pulseCard]])}}
function dproof(k,b){if(phase!=='proof'||b.classList.contains('no'))return;const L=DD.levels[dl],C=L.cases[dc];
  if(C.proof.includes(k)){b.classList.add('yes');phase='done';const s=dtries===0?3:2;dearn.push(s);cheer();
    popup(true,null,'<div class="emo">'+art(C.obj)+'</div>'+DU.solved+'<div class="stars">'+starStr(s)+'</div>',
      [[dc<L.cases.length-1?DU.next_case:U.finish,()=>{const a=DD.art[C.obj];const e=document.createElement('span');
        e.innerHTML=isImg(a)?'<img src="'+a+'" alt="">':'<span class="e">'+a+'</span>';$('dBag').appendChild(e.firstChild);
        dc++;if(dc<L.cases.length)dcase();else ddone()}]])}
  else{dtries++;b.classList.add('no');tone(300,0,.2);popup(false,null,DU.proof_wrong,[[U.retry,()=>{}]])}}
function ddone(){const L=DD.levels[dl];[...$('ddots').children].forEach(d=>d.classList.add('on'));
  const avg=dearn.reduce((a,b)=>a+b,0)/dearn.length;dprog.stars[dl]=Math.max(dprog.stars[dl]||0,avg);dsave();cheer();
  const last=dl===DD.levels.length-1,img=isImg(DD.art.detective)?DD.art.detective:D.hero;
  popup(true,img,(last?DU.det_all:DU.det_done+' '+L.name+'!')+'<div class="stars">'+starStr(Math.round(avg))+'</div>',
    last?[[U.to_levels,()=>{drawDL();show('sDL')}]]:[[U.next_lvl,()=>dstart(dl+1)],[U.to_levels,()=>{drawDL();show('sDL')}]])}
</script>
</body>
</html>
